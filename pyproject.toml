[project]
name = "clusterbench"
version = "0.0.1"
description = "Concurrency-sweep orchestrator + LiteLLM /metrics collector + dashboard, wrapping mini-swe-agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.137.2",
    "uvicorn[standard]==0.49.0",
    "httpx==0.28.1",
    "aiohttp==3.14.1",
]

[project.optional-dependencies]
# Real-path deps — heavy (Docker images, GPU, SWE-bench Verified dataset).
# The mock path (CI-friendly) needs only the base dependencies above. Install
# for real runs with:  uv sync --extra real
real = [
    "mini-swe-agent==2.4.1",
    "swebench==4.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clusterbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
